# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "hletelo24-patch-2" ]
  pull_request:
    branches: [ "hletelo24-patch-2" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore ./race_day_backend_api.slnx
    - name: Build
      run: dotnet build ./race_day_backend_api.slnx --no-restore
    - name: Test
      run: dotnet test ./race_app_api_test/race_app_api_test.csproj --no-build --verbosity normal
